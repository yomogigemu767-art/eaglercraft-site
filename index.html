<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:white;" id="game_frame">
<div id="setupScreen" style="margin:0;width:100%;height:100%;font-family:sans-serif;display:flex;align-items:center;justify-content:center;user-select:none;background:#111;color:white;padding:20px;box-sizing:border-box;">
<div style="max-width:520px;text-align:center;">
<h2>Eaglercraft 1.8 — 分割版</h2>
<p>まず <b>client.js</b> と <b>assets.epk</b> をそれぞれ選択してください。</p>
<p><label>① ゲーム本体 client.js<br><input id="clientPicker" type="file" accept=".js,text/javascript,application/javascript" style="max-width:100%;color:white;" /></label></p>
<p><label>② 追加データ assets.epk<br><input id="assetPicker" type="file" accept=".epk,application/octet-stream" style="max-width:100%;color:white;" /></label></p>
<p id="assetStatus">2つのファイルを選択してください</p>
<p><button id="launchButton" disabled>ゲームを起動</button>　<button id="bootButton" disabled>起動メニュー</button></p>
<p style="font-size:13px;color:#bbb;">※ 2つのファイルを選択して、このページ内で読み込みます。公式サイトへ移動しません。iPhone Safariで動作する保証はありません。</p>
</div>
</div>
<script type="text/javascript">
"use strict";
(function(){
  var assetFile = null;
  var clientFile = null;
  var clientURL = null;
  var assetURL = null;
  var started = false;
  var status = document.getElementById("assetStatus");
  var picker = document.getElementById("assetPicker");
  var clientPicker = document.getElementById("clientPicker");
  var launchButton = document.getElementById("launchButton");
  var bootButton = document.getElementById("bootButton");
  if (!status || !picker || !clientPicker || !launchButton || !bootButton) return;
  clientPicker.addEventListener("change", function() {
    clientFile = clientPicker.files && clientPicker.files[0] ? clientPicker.files[0] : null;
    updateReady();
  });
  function updateReady() {
    if (clientFile && assetFile) {
      status.textContent = "選択済み: " + clientFile.name + " + " + assetFile.name;
      launchButton.disabled = false;
      bootButton.disabled = false;
    } else {
      status.textContent = "client.js と assets.epk の両方を選択してください";
      launchButton.disabled = true;
      bootButton.disabled = true;
    }
  }
  picker.addEventListener("change", function() {
    assetFile = picker.files && picker.files[0] ? picker.files[0] : null;
    updateReady();
  });
  function launch(showBootMenu) {
    if (started || !assetFile || !clientFile) return;
    started = true;
    launchButton.disabled = true;
    bootButton.disabled = true;
    status.textContent = "ゲーム本体を読み込んでいます…";
    try {
      if (clientURL) URL.revokeObjectURL(clientURL);
      if (assetURL) URL.revokeObjectURL(assetURL);
      clientURL = URL.createObjectURL(clientFile);
      assetURL = URL.createObjectURL(assetFile);
      window.eaglercraftXOpts = {
        container: "game_frame",
        worldsDB: "worlds",
        relays: [ { addr: "wss://relay.eaglercraft.net/", comment: "Eaglercraft Shared World Relay", primary: true } ],
        assetsURI: assetURL
      };
      if (showBootMenu) window.eaglercraftXOpts.showBootMenuOnLaunch = true;
      var setup = document.getElementById("setupScreen");
      if (setup) setup.style.display = "none";
      var script = document.createElement("script");
      script.src = clientURL;
      script.onload = function() {
        // Eaglercraft client initializes itself when its script loads.
      };
      script.onerror = function() {
        started = false;
        status.style.display = "block";
        status.textContent = "client.js の読み込みに失敗しました。ファイルを選び直してください。";
        if (setup) setup.style.display = "flex";
        launchButton.disabled = false;
        bootButton.disabled = false;
      };
      document.body.appendChild(script);
    } catch (e) {
      started = false;
      if (setup) setup.style.display = "flex";
      status.textContent = "起動エラー: " + (e && e.message ? e.message : String(e));
      launchButton.disabled = false;
      bootButton.disabled = false;
    }
  }
  launchButton.addEventListener("click", function(){ launch(false); });
  bootButton.addEventListener("click", function(){ launch(true); });
  window.addEventListener("error", function(e) {
    if (started) {
      var msg = e && e.message ? e.message : "不明なエラー";
      try { console.error("Eaglercraft error:", msg); } catch (_) {}
    }
  });
})();
</script>
